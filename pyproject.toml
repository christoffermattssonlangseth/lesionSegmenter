[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "lesionseg"
version = "0.1.0"
description = "Outline EAE lesions (core / rim / peri-lesion) from nuclear density and Pu.1+ myeloid cells in whole-slide CZI scans, and export cells for Deep Visual Proteomics (LMD)."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Christoffer Mattsson Langseth", email = "christoffer.langseth@scilifelab.se" }]
dependencies = [
  "numpy>=1.24",
  "scipy>=1.10",
  "pandas>=2.0",
  "pyarrow>=12",
  "scikit-image>=0.21",
  "scikit-learn>=1.3",
  "shapely>=2.0",
  "tifffile>=2023.2",
  "matplotlib>=3.7",
  "pyyaml>=6",
  "typer>=0.9",
  "tqdm>=4.65",
  "aicspylibczi>=3.1",
]

[project.optional-dependencies]
cellpose = ["cellpose>=3.0", "torch>=2.0"]
stardist = ["stardist>=0.8", "tensorflow>=2.12"]
lmd = ["py-lmd>=1.3"]
viewer = ["napari[all]>=0.4.18"]
dev = ["pytest>=7", "ruff>=0.4", "jupyterlab>=4", "nbformat>=5.9"]

[project.scripts]
lesionseg = "lesionseg.cli:app"

[tool.setuptools.packages.find]
include = ["lesionseg*"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
ignore = ["B008"]  # typer.Option in defaults is the idiom

[tool.pytest.ini_options]
testpaths = ["tests"]
