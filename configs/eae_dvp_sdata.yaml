# EAE / DVP – SpatialData input (Cellpose masks + annotated cell table from cellpose_output.zip)
# Coordinates: full-resolution scene pixels (labels == cell_id), 0.325 µm/px.
output_dir: outputs/sdata
table: ../data/masks/cellpose_output/cell_table_full_annotated_v2.h5ad

channels: {nuclei: SYTOG, pu1: AF647}    # CZI channel names (AF647 = Pu.1, AF555 = Iba1)
overview_scale: 0.05

spatialdata:
  labels: filtered          # use *_masks_filtered (cells that survived QC)
  pu1_col: Pu1_class
  pu1_positive: Pu1_positive

masks: {contours: pu1}      # exact Cellpose outlines for Pu.1+ cells (LMD / QuPath)
pu1: {method: mask}         # positivity from the table

tissue: {source: cells, min_cells_per_mm2: 100, sigma_um: 30}
density: {bin_um: 10, sigma_um: 40}
# Lesion detection: supervised model trained on the manual CORE annotations (leave-one-scene-out
# models, so every scene is scored by a model that never saw its own annotations).
# Baseline alternative: score: pu1_density, threshold: {type: zscore, value: 3.0, seed: 6}
lesion:
  score: model
  model: ../models/lesion_hgb_loso_excl_CML_1.joblib      # overridden per sample below
  threshold: {type: absolute, value: 0.25, seed: 0.5}   # grow at p>0.25, must contain a p>0.5 seed
  min_area_um2: 5000
  smooth_um: 20
  # zone widths as fractions of each section's equivalent radius (sections differ in size:
  # cervical vs thoracic vs lumbar). Median radius ≈ 1 mm → 0.05 ≈ 50 µm, 0.15 ≈ 150 µm.
  rim_width_rel: 0.05
  peri_width_rel: 0.15
  deep_width_rel: 0.15           # one more band beyond peri (the "additional step"); the rest stays distal
  rim_width_um: 50               # fallbacks outside sections
  peri_width_um: 150
  deep_width_um: 150
  min_pu1_fraction: 0.0          # the model already learned the myeloid context
  min_lesion_pu1_fraction: 0.0

# Only sections with manually annotated lesions carry lesions; the rest are lesion-free controls.
sections: {focus: manual}

# Parenchyma / meninges (lesionseg.meninges, results/meninges_tiers): the meninges boundary is placed
# per location – the outer 10 µm of the true surface (outermost nuclei) plus very compact, surface-connected
# meningeal infiltrate (nuclei touching; can swell to 40–80 µm next to lesions), with a 10 µm buffer inward
# that is never collected, so meninges and lesion pools never touch. Thin flaps / roots (opening with a
# 150 µm disk) are meninges too. `method: band` restores the old fixed 30 µm band (erode_um).
parenchyma:
  method: adaptive
  open_um: 150
  erode_um: 30            # band method only
  # manual CORE polygons are protected: never meninges or buffer (meninges must never enter the annotated
  # lesions); compact_q 99.9 because looser growth also swallows lymphocyte-rich subpial lesion
  adaptive: {seed_um: 10, max_um: 80, compact_q: 99.9, compact_sigma_um: 8, gap_um: 10, cell_gap_um: 6,
             protect_manual_cores: true}
assign: {distance_bins_um: [-100, -50, 0, 50, 100, 150, 300]}
export: {cell_geojson: pu1}

# Mass-spec reaction plan (important-info.md): ≤60 reactions, ~250 Pu.1+ cells each or more (VBO: all cells); replicate slides of a
# section are pooled; lesion sections -> core/rim/peri/deep per section; controls -> GM/WM per section
# (CFA pooled; other controls pooled only if over budget); VBO -> one reaction per section.
reactions:
  target_cells: 250           # general target (reactions below 0.8 x target are flagged as shortfall), not a cap
  max_cells: null             # null = collect every eligible cell; set a number to cap each reaction
  max_reactions: 60
  pool_cfa: true
  pool_other_gm_wm: auto      # auto (least pooling that fits) | prefix | true | false
  control_prefixes: [OS]      # pooled first when over budget (CFA is always pooled via pool_cfa)
  lesion_compartments: [core, rim, peri, deep]
  vbo_per_section: true
  vbo_all_cells: true         # VBO reactions capture every cell in the polygons, not only Pu.1+
  order: random               # only with max_cells: stratified over the two replicate slides, random within a slide
  edge_exclusion_um: 100

# LMD wells: rings as fractions of the section radius (0.1 ≈ 100 µm at R = 1 mm).
# To capture more material raise target_area_um2 (µm² of Pu.1+ nuclei per well) – the capture_sites
# table lists how much is available per compartment.
wells:
  target_area_um2: 3000
  edge_exclusion_um: 100
  groups:
    - {name: core, zone: [core]}
    - {name: rim, zone: [rim]}
    - {name: ring_0_10, dist_rel: [0.0, 0.1]}
    - {name: ring_10_20, dist_rel: [0.1, 0.2]}
    - {name: ring_20_40, dist_rel: [0.2, 0.4]}
    - {name: ring_40_60, dist_rel: [0.4, 0.6]}      # deeper into the tissue …
    - {name: ring_60_plus, dist_rel: [0.6, 10.0]}   # … up to the far edge of the section
    - {name: GM, manual: [GM], zone: [distal]}
    - {name: WM, manual: [WM], zone: [distal]}

samples:
  - name: CML_1
    image: ../data/raw/20260917_CML_1.czi
    sdata: ../data/masks/cellpose_output/20260917_CML_1.zarr
    slide_name: 20260917_CML_1
    scenes: [0]
    lesion: {model: ../models/lesion_hgb_loso_excl_CML_1.joblib}
  - name: CML_2_rescan
    image: ../data/raw/20260917_CML_2_rescan.czi
    sdata: ../data/masks/cellpose_output/20260917_CML_2_rescan.zarr
    slide_name: 20260917_CML_2_rescan
    scenes: [0]
    lesion: {model: ../models/lesion_hgb_loso_excl_CML_2_rescan.joblib}
  - name: CML_metal
    image: ../data/raw/20260917_CML_metal.czi
    channels: {nuclei: DAPI, pu1: AF647}
    sdata: {0: ../data/masks/cellpose_output/20260917_CML_metal_scene0.zarr,
            1: ../data/masks/cellpose_output/20260917_CML_metal_scene1.zarr}
    slide_name: {0: 20260917_CML_metal_scene0, 1: 20260917_CML_metal_scene1}
    scenes: [0, 1]
    lesion: {model: {0: ../models/lesion_hgb_loso_excl_CML_metal_scene0.joblib,
                     1: ../models/lesion_hgb_loso_excl_CML_metal_scene1.joblib}}
